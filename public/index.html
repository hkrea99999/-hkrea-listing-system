<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>員工登入 - 香港物業</title>
<style>
  body{
    font-family:"PingFang HK","Noto Sans HK",sans-serif; background:#f4f4f5;
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  }
  .card{
    background:#fff; padding:36px 32px; border-radius:16px; width:100%; max-width:340px;
    box-shadow:0 4px 24px rgba(0,0,0,.08);
  }
  h1{font-size:18px; text-align:center; margin:0 0 4px;}
  p.sub{text-align:center; color:#888; font-size:13px; margin:0 0 24px;}
  label{font-size:13px; color:#444; display:block; margin-bottom:4px;}
  input{
    width:100%; padding:10px 12px; border:1px solid #ddd; border-radius:8px;
    margin-bottom:16px; font-size:14px; box-sizing:border-box;
  }
  button{
    width:100%; padding:11px; background:#8b1a1a; color:#fff; border:none;
    border-radius:8px; font-size:15px; cursor:pointer;
  }
  button:disabled{opacity:.6;}
  .err{color:#b91c1c; font-size:13px; margin-bottom:12px; display:none;}
</style>
</head>
<body>
  <div class="card">
    <h1>香港物業 員工登入</h1>
    <p class="sub">放盤紀錄管理系統</p>
    <div class="err" id="err"></div>
    <label>電郵</label>
    <input type="email" id="email" placeholder="you@company.com">
    <label>密碼</label>
    <input type="password" id="password">
    <button id="loginBtn" onclick="login()">登入</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    // TODO: 換做你自己個Supabase project嘅資料 (Project Settings → API)
    const SUPABASE_URL = "https://berctchwlzjskjcjzani.supabase.co/rest/v1/";
    const SUPABASE_ANON_KEY = "sb_publishable__Nvdq0ZufT37BRdJ1F_TyA_IqkYnqj1";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 如果已經登入咗，直接去dashboard
    sb.auth.getSession().then(({data}) => {
      if (data.session) window.location.href = "dashboard.html";
    });

    async function login(){
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errBox = document.getElementById('err');
      const btn = document.getElementById('loginBtn');
      errBox.style.display = 'none';
      btn.disabled = true; btn.textContent = '登入緊…';

      const { error } = await sb.auth.signInWithPassword({ email, password });

      if (error){
        errBox.textContent = '登入失敗：電郵或密碼錯誤';
        errBox.style.display = 'block';
        btn.disabled = false; btn.textContent = '登入';
        return;
      }
      window.location.href = "dashboard.html";
    }
  </script>
</body>
</html>
