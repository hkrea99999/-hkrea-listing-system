<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新增放盤 - 香港物業</title>
<style>
  :root{ --ink:#1a1a1a; --muted:#6b6b6b; --line:#ddd; --accent:#8b1a1a; --bg:#f4f4f5; --field-bg:#fafafa; }
  *{box-sizing:border-box;}
  body{ font-family:"PingFang HK","Noto Sans HK",sans-serif; background:var(--bg); margin:0; padding:24px 16px 80px; color:var(--ink); }
  .wrap{max-width:1280px; margin:0 auto;}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:8px;}
  h1{font-size:19px; margin:0;}
  a.back{font-size:13px; color:var(--muted); text-decoration:none;}
  .layout{display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start;}
  @media (max-width:900px){ .layout{grid-template-columns:1fr;} }
  .col{position:sticky; top:20px;}
  .card{background:#fff; border-radius:14px; padding:22px 20px; box-shadow:0 2px 12px rgba(0,0,0,.05); margin-bottom:16px;}
  .card h2{font-size:15px; margin:0 0 14px; color:var(--accent);}
  label{display:block; font-size:13px; color:#444; margin:0 0 4px;}
  input[type=text], input[type=number], input[type=date], textarea, select{
    width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px;
    font:inherit; margin-bottom:14px; background:var(--field-bg);
  }
  input:disabled, textarea:disabled, select:disabled{ background:#eee; color:#888; }
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:0 14px;}
  .choice{display:flex; gap:16px; margin-bottom:14px; flex-wrap:wrap;}
  .choice label{display:flex; align-items:center; gap:6px; font-size:14px; margin:0;}
  .choice input{width:auto; margin:0;}
  .btn{ background:var(--accent); color:#fff; border:none; padding:13px 24px; border-radius:10px; font-size:15px; cursor:pointer; width:100%; }
  .btn:disabled{opacity:.6;}
  .msg{font-size:13px; margin-bottom:14px; padding:10px 12px; border-radius:8px; display:none;}
  .msg.err{background:#fde8e8; color:#a11; display:block;}
  .msg.info{background:#e8f0fd; color:#1a4a8b; display:block;}
  .success{ display:none; text-align:center; background:#fff; border-radius:14px; padding:32px 20px; box-shadow:0 2px 12px rgba(0,0,0,.05); }
  .success .serial{ font-size:22px; font-weight:700; color:var(--accent); margin:8px 0 20px; background:#f6e9e9; display:inline-block; padding:6px 18px; border-radius:8px; }
  .success .actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
  .success .actions a, .success .actions button{ padding:11px 18px; border-radius:8px; font-size:14px; text-decoration:none; border:none; cursor:pointer; }
  .success .actions .primary{background:var(--accent); color:#fff;}
  .success .actions .secondary{background:#eee; color:#333;}

  /* live preview styling (mirrors form3) */
  .preview{ background:#fff; border-radius:14px; padding:26px 24px; box-shadow:0 2px 12px rgba(0,0,0,.05); font-size:14px; line-height:1.85; }
  .preview h3{ text-align:center; font-size:17px; margin:0 0 2px; }
  .preview .sub{ text-align:center; color:var(--muted); font-size:12px; margin-bottom:18px; }
  .preview .serial-badge{ display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:14px; }
  .preview .serial-badge span.b{ background:#f1eeee; padding:2px 10px; border-radius:6px; font-weight:600; }
  .preview .blank{ display:inline-block; border-bottom:1px solid #999; min-width:70px; padding:0 3px; color:var(--accent); font-weight:600; }
  .preview .blank.empty{ color:#bbb; font-weight:400; }
  .preview section{ margin-bottom:16px; border-top:1px dashed #eee; padding-top:12px; }
  .preview section h4{ font-size:13.5px; margin:0 0 6px; color:var(--accent); }
</style>
</head>
<body>
<div class="wrap">

  <div id="formView">
    <div class="topbar">
      <h1 id="pageTitle">新增放盤</h1>
      <a class="back" href="dashboard.html">← 返回紀錄</a>
    </div>

    <div class="msg err" id="errMsg"></div>
    <div class="msg info" id="lockMsg" style="display:none;">此記錄已簽署，只有管理員可以編輯。</div>

    <div class="layout">
      <div>
        <div class="card">
          <h2>1. 代理委任</h2>
          <label>賣方姓名</label>
          <input type="text" id="seller_name" oninput="renderPreview()">
          <div class="grid2">
            <div>
              <label>賣方香港身分證號碼（如適用）</label>
              <input type="text" id="seller_id" oninput="renderPreview()">
            </div>
            <div>
              <label>賣方聯絡電話</label>
              <input type="text" id="seller_phone" oninput="renderPreview()">
            </div>
          </div>
          <label>代理關係</label>
          <div class="choice">
            <label><input type="radio" name="agency_type" value="獨家" onchange="renderPreview()"> 獨家代理</label>
            <label><input type="radio" name="agency_type" value="非獨家" onchange="renderPreview()"> 非獨家代理</label>
          </div>
          <label>物業地址</label>
          <input type="text" id="property_address" oninput="renderPreview()">
          <div class="grid2">
            <div>
              <label>協議生效日</label>
              <input type="date" id="effective_from" oninput="renderPreview()">
            </div>
            <div>
              <label>協議屆滿日</label>
              <input type="date" id="effective_to" oninput="renderPreview()">
            </div>
          </div>
        </div>

        <div class="card">
          <h2>2. 代理關係類別</h2>
          <div class="choice">
            <label><input type="radio" name="rel_type" value="單邊代理" onchange="renderPreview()"> 單邊代理</label>
            <label><input type="radio" name="rel_type" value="雙邊代理" onchange="renderPreview()"> 雙邊代理</label>
            <label><input type="radio" name="rel_type" value="有可能代表雙方" onchange="renderPreview()"> 有可能代表雙方</label>
          </div>
        </div>

        <div class="card">
          <h2>3. 放盤價</h2>
          <label>放盤價（港幣 HK$）</label>
          <input type="number" id="asking_price" placeholder="例如 8000000" oninput="renderPreview()">
        </div>

        <div class="card">
          <h2>4. 佣金</h2>
          <div class="grid2">
            <div>
              <label>佣金收取時點</label>
              <select id="commission_timing" onchange="renderPreview()">
                <option value="簽署買賣協議時">簽署買賣協議時</option>
                <option value="物業交易完成時">物業交易完成時</option>
              </select>
            </div>
            <div>
              <label>佣金（金額 或 百分比%）</label>
              <input type="text" id="commission_value" placeholder="例如 1% 或 $80000" oninput="renderPreview()">
            </div>
          </div>
        </div>

        <div class="card">
          <h2>6-9. 視察物業 / 分銷 / 廣告 / 權益披露</h2>
          <label>賣方同意容許代理/買方查看物業</label>
          <div class="choice">
            <label><input type="radio" name="q_viewing" value="同意" onchange="renderPreview()"> 同意</label>
            <label><input type="radio" name="q_viewing" value="不同意" onchange="renderPreview()"> 不同意</label>
          </div>
          <label>賣方同意將鎖匙交由代理保管</label>
          <div class="choice">
            <label><input type="radio" name="q_key" value="同意" onchange="renderPreview()"> 同意</label>
            <label><input type="radio" name="q_key" value="不同意" onchange="renderPreview()"> 不同意</label>
          </div>
          <label>賣方授權代理分銷放盤</label>
          <div class="choice">
            <label><input type="radio" name="q_distribute" value="同意" onchange="renderPreview()"> 同意</label>
            <label><input type="radio" name="q_distribute" value="不同意" onchange="renderPreview()"> 不同意</label>
          </div>
          <label>賣方授權代理發出廣告</label>
          <div class="choice">
            <label><input type="radio" name="q_advertise" value="同意" onchange="renderPreview()"> 同意</label>
            <label><input type="radio" name="q_advertise" value="不同意" onchange="renderPreview()"> 不同意</label>
          </div>
          <label>代理對物業擁有金錢上或其他實益的權益</label>
          <div class="choice">
            <label><input type="radio" name="q_interest" value="有" onchange="renderPreview()"> 有</label>
            <label><input type="radio" name="q_interest" value="沒有" onchange="renderPreview()"> 沒有</label>
          </div>
        </div>

        <div class="card">
          <h2>13. 額外條款</h2>
          <textarea id="extra_terms" rows="3" placeholder="如有額外條款請在此填寫" oninput="renderPreview()"></textarea>
        </div>

        <button class="btn" id="submitBtn" onclick="submitListing()">建立放盤記錄，生成流水號</button>
      </div>

      <div class="col">
        <div class="preview" id="previewBox">
          <h3>出售香港住宅物業用的地產代理協議</h3>
          <div class="sub">即時預覽</div>
          <div class="serial-badge"><span>流水號</span><span class="b" id="pvSerial">待建立</span></div>
          <div id="pvBody"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="success" id="successView">
    <div>放盤記錄已建立</div>
    <div class="serial" id="serialOut"></div>
    <div class="actions">
      <a class="primary" id="signNowLink" href="#">即場請客人簽署</a>
      <button class="secondary" onclick="copyLink()">複製簽署link</button>
      <a class="secondary" href="dashboard.html">返回紀錄列表</a>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  // TODO: 換做你自己個Supabase project嘅資料（同index.html/dashboard.html必須一字不漏一致，尾巴唔好有斜線）
  const SUPABASE_URL = "https://berctchwlzjskjcjzani.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable__Nvdq0ZufT37BRdJ1F_TyA_IqkYnqj1";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const params = new URLSearchParams(window.location.search);
  const editingSerial = params.get('serial');
  let isAdmin = false;
  let recordLocked = false;

  function val(id){ return document.getElementById(id).value || null; }
  function setVal(id, v){ if (v !== null && v !== undefined) document.getElementById(id).value = v; }
  function radio(name){ const el = document.querySelector(`input[name="${name}"]:checked`); return el ? el.value : null; }
  function setRadio(name, v){ if (!v) return; const el = document.querySelector(`input[name="${name}"][value="${v}"]`); if (el) el.checked = true; }
  function b(v, label){ return v ? `<span class="blank">${v}</span>` : `<span class="blank empty">${label || '未填'}</span>`; }

  function renderPreview(){
    document.getElementById('pvSerial').textContent = editingSerial || '待建立';
    const html = `
      <section><h4>1. 代理委任</h4>
        本人/我們 ${b(val('seller_name'))}（「賣方」）現委任代理，以推銷位於 ${b(val('property_address'))} 的物業。
        代理關係：${b(radio('agency_type'))}。生效日：${b(val('effective_from'))} 至 ${b(val('effective_to'))}。
      </section>
      <section><h4>2. 代理關係類別</h4>${b(radio('rel_type'))}</section>
      <section><h4>3. 放盤價</h4>港幣 ${b(val('asking_price') ? ('HK$' + val('asking_price')) : null)}</section>
      <section><h4>4. 佣金</h4>${b(val('commission_timing'))} 支付 ${b(val('commission_value'))}</section>
      <section><h4>6-9. 視察 / 分銷 / 廣告 / 權益</h4>
        查看物業：${b(radio('q_viewing'))}　鎖匙保管：${b(radio('q_key'))}<br>
        分銷放盤：${b(radio('q_distribute'))}　廣告宣傳：${b(radio('q_advertise'))}<br>
        代理權益：${b(radio('q_interest'))}
      </section>
      <section><h4>13. 額外條款</h4>${b(val('extra_terms'), '沒有')}</section>
    `;
    document.getElementById('pvBody').innerHTML = html;
  }

  function applyLock(locked){
    recordLocked = locked;
    document.querySelectorAll('input, select, textarea').forEach(el => el.disabled = locked);
    document.getElementById('submitBtn').disabled = locked;
    document.getElementById('lockMsg').style.display = locked ? 'block' : 'none';
  }

  async function init(){
    const { data: { session } } = await sb.auth.getSession();
    if (!session){ window.location.href = "index.html"; return; }

    const { data: adminRow } = await sb.from('admins').select('user_id').eq('user_id', session.user.id).maybeSingle();
    isAdmin = !!adminRow;

    if (editingSerial){
      document.getElementById('pageTitle').textContent = '編輯放盤 ' + editingSerial;
      const { data, error } = await sb.from('listings').select('*').eq('serial_no', editingSerial).single();
      if (error || !data){
        document.getElementById('errMsg').textContent = '搵唔到呢筆記錄。';
        document.getElementById('errMsg').style.display = 'block';
        return;
      }
      setVal('seller_name', data.seller_name);
      setVal('property_address', data.property_address);
      setRadio('agency_type', data.agency_type);
      setVal('effective_from', data.effective_from);
      setVal('effective_to', data.effective_to);
      setVal('asking_price', data.asking_price);
      const fd = data.form_data || {};
      setVal('seller_id', fd.seller_id);
      setVal('seller_phone', fd.seller_phone);
      setRadio('rel_type', fd.rel_type);
      if (fd.commission_timing) setVal('commission_timing', fd.commission_timing);
      setVal('commission_value', fd.commission_value);
      setRadio('q_viewing', fd.q_viewing);
      setRadio('q_key', fd.q_key);
      setRadio('q_distribute', fd.q_distribute);
      setRadio('q_advertise', fd.q_advertise);
      setRadio('q_interest', fd.q_interest);
      setVal('extra_terms', fd.extra_terms);

      if (data.status === 'signed' && !isAdmin) applyLock(true);
    }
    renderPreview();
  }

  async function submitListing(){
    const errBox = document.getElementById('errMsg');
    const btn = document.getElementById('submitBtn');
    errBox.style.display = 'none';

    const seller_name = val('seller_name');
    const property_address = val('property_address');
    if (!seller_name || !property_address){
      errBox.textContent = '請至少填寫賣方姓名同物業地址先可以建立記錄。';
      errBox.style.display = 'block';
      return;
    }

    btn.disabled = true; btn.textContent = editingSerial ? '更新緊…' : '建立緊…';

    const record = {
      seller_name, property_address,
      agency_type: radio('agency_type'),
      effective_from: val('effective_from'),
      effective_to: val('effective_to'),
      asking_price: val('asking_price'),
      form_data: {
        seller_id: val('seller_id'), seller_phone: val('seller_phone'),
        rel_type: radio('rel_type'), commission_timing: val('commission_timing'),
        commission_value: val('commission_value'), q_viewing: radio('q_viewing'),
        q_key: radio('q_key'), q_distribute: radio('q_distribute'),
        q_advertise: radio('q_advertise'), q_interest: radio('q_interest'),
        extra_terms: val('extra_terms')
      }
    };

    let serial, error;
    if (editingSerial){
      const res = await sb.from('listings').update(record).eq('serial_no', editingSerial).select('serial_no').single();
      serial = res.data?.serial_no; error = res.error;
    } else {
      record.status = 'draft';
      const res = await sb.from('listings').insert(record).select('serial_no').single();
      serial = res.data?.serial_no; error = res.error;
    }

    if (error){
      errBox.textContent = '儲存失敗：' + error.message;
      errBox.style.display = 'block';
      btn.disabled = false; btn.textContent = editingSerial ? '更新記錄' : '建立放盤記錄，生成流水號';
      return;
    }

    document.getElementById('formView').style.display = 'none';
    document.getElementById('successView').style.display = 'block';
    document.getElementById('serialOut').textContent = serial;
    const signUrl = `${window.location.origin}/sign.html?serial=${encodeURIComponent(serial)}`;
    document.getElementById('signNowLink').href = signUrl;
    window._signUrl = signUrl;
  }

  function copyLink(){
    navigator.clipboard.writeText(window._signUrl).then(() => alert('簽署link已複製'));
  }

  init();
</script>
</body>
</html>
