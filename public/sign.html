<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>簽署 - 出售香港住宅物業用的地產代理協議</title>
<style>
  :root{ --ink:#1a1a1a; --muted:#6b6b6b; --line:#c9c9c9; --accent:#8b1a1a; --field-bg:#fafafa; --tag:#eef0f2; }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:#e7e7e8; color:var(--ink);
    font-family:"PingFang HK","Noto Sans HK","Microsoft JhengHei",sans-serif;
    padding:14px 10px calc(30px + env(safe-area-inset-bottom)); font-size:15px; line-height:1.7;
  }
  .shell{max-width:860px; margin:0 auto; min-width:0;}
  .pvport{overflow-x:hidden;}
  .pvbar{display:flex; justify-content:space-between; align-items:center; gap:10px;
    font-size:12.5px; color:#555; margin-bottom:8px;}
  .pvbar button{font:inherit; font-size:12.5px; border:1px solid var(--line); background:#fff;
    color:#444; padding:5px 12px; border-radius:6px; cursor:pointer;}
  .pvholder{position:relative;}
  .pvscale{width:794px; transform-origin:top left;}

  .panel{background:#fff; border-radius:14px; padding:18px 16px; margin-top:16px; box-shadow:0 2px 14px rgba(0,0,0,.07);}
  .panel h2{font-size:15px; margin:0 0 10px; color:var(--accent);}
  .sig-box{border:1px dashed var(--line); border-radius:10px; height:150px; background:var(--field-bg); position:relative;}
  .sig-box canvas{width:100%; height:100%; border-radius:10px; touch-action:none; display:block;}
  .sig-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:6px;}
  .sig-actions button{font:inherit; font-size:12.5px; border:1px solid var(--line); background:var(--tag); color:var(--ink); padding:6px 12px; border-radius:6px; cursor:pointer;}
  .confirm-row{display:flex; align-items:flex-start; gap:8px; font-size:13.5px; margin:14px 0; color:#444;}
  .confirm-row input{margin-top:5px;}
  .submitBtn{width:100%; background:var(--accent); color:#fff; border:none; padding:14px; border-radius:10px; font:inherit; font-size:16px; cursor:pointer;}
  .submitBtn:disabled{opacity:.5;}
  .msg{font-size:13px; padding:10px 12px; border-radius:8px; margin-bottom:12px; display:none;}
  .msg:empty{display:none !important; padding:0; margin:0;}
  .msg.err{background:#fde8e8; color:#a11; display:block;}
  .msg.warn{background:#fff3cd; color:#7a5c00; display:block;}
  .center-state{max-width:520px; margin:70px auto; text-align:center; background:#fff; border-radius:14px; padding:34px 22px; box-shadow:0 2px 16px rgba(0,0,0,.07);}
  .center-state .serial-big{font-size:20px; font-weight:700; color:var(--accent); margin:10px 0;}
  .center-state a.dl, .center-state button.dl{
    display:inline-block; margin:14px 6px 0; background:var(--accent); color:#fff; padding:12px 22px;
    border:none; border-radius:10px; text-decoration:none; font:inherit; font-size:15px; cursor:pointer;
  }
  .center-state button.ghost{background:#eee; color:#333;}

  .cmodal{position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center;
    justify-content:center; z-index:999; padding:16px;}
  .cmodal.on{display:flex;}
  .cmodal .box{background:#fff; border-radius:14px; max-width:420px; width:100%; padding:22px 20px; text-align:center;}
  .cmodal .box h3{margin:0 0 10px; font-size:16px; color:var(--accent);}
  .cmodal .box p{font-size:13.5px; color:#444; line-height:1.6; margin:0 0 18px;}
  .cmodal .box .btns{display:flex; gap:10px;}
  .cmodal .box button{flex:1; font:inherit; font-size:14.5px; padding:11px; border-radius:9px; border:none; cursor:pointer;}
  .cmodal .box .yes{background:var(--accent); color:#fff;}
  .cmodal .box .no{background:#eee; color:#333;}
  @media print{
    body{background:#fff; padding:0;}
    .panel, .pvbar, #viewBar, #busy, #pdfStage{display:none !important;}
    .pvport{overflow:visible !important;}
    .pvholder{height:auto !important; width:auto !important;}
    .pvscale{transform:none !important; width:793px !important;}
  }
</style>
</head>
<body>

<div id="loadingState" class="center-state">載入緊資料…</div>

<div id="errorState" class="center-state" style="display:none;">
  <div>搵唔到呢份文件，link可能已失效。</div>
</div>

<div id="signedState" class="center-state" style="display:none;">
  <div>✓ 呢份協議已經完成簽署</div>
  <div class="serial-big" id="signedSerial"></div>
  <div style="font-size:13px; color:var(--muted);">簽署時間：<span id="signedAt"></span></div>
  <div class="msg warn" id="dlWarn"></div>
  <div style="font-size:13px; color:var(--muted); max-width:420px; margin:10px auto; line-height:1.6;">
    你可以下載已簽署嘅PDF留底做副本；如果想儲落手機相簿，喺下面文件圖片度長按（iPhone/Android都得）揀「儲存圖片」就得，同其他政府表格一樣簡單。
  </div>
  <div>
    <a class="dl" id="downloadLink" href="#" target="_blank" rel="noopener">下載已簽署PDF</a>
    <button class="dl ghost" id="regenBtn" style="display:none;" onclick="regeneratePdf()">重新生成PDF</button>
  </div>
</div>

<div id="docView" style="display:none;">
  <div class="shell">
    <div class="pvbar">
      <span>請細閱以下協議全文（A4 · 2 頁）</span>
      <button type="button" id="pvZoom" onclick="toggleZoom()"></button>
    </div>
    <div class="pvport" id="pvPort">
      <div class="pvholder" id="pvHolder"><div class="pvscale" id="pvScale"></div></div>
    </div>

    <div id="viewBar" style="display:none; gap:10px; flex-wrap:wrap; margin-top:14px;">
      <button class="submitBtn" style="width:auto; padding:11px 20px;" onclick="downloadPdf()">下載PDF</button>
      <button class="submitBtn" style="width:auto; padding:11px 20px; background:#eee; color:#333;" onclick="window.print()">列印</button>
      <a class="submitBtn" style="width:auto; padding:11px 20px; background:#eee; color:#333; text-decoration:none; display:inline-block;" href="dashboard.html">返回紀錄</a>
    </div>

    <div class="panel">
      <h2>賣方簽署確認</h2>
      <div class="confirm-row">
        <input type="checkbox" id="confirmRead">
        <label for="confirmRead">本人已閱讀並明白以上協議（包括附表1至4）的全部內容，同意上述條款，並確認以下簽名代表本人的正式簽署。</label>
      </div>
      <div class="sig-box"><canvas id="sigCanvas"></canvas></div>
      <div class="sig-actions"><button type="button" onclick="clearSig()">清除簽名</button></div>
      <div class="msg err" id="errMsg"></div>
      <button class="submitBtn" id="submitBtn" onclick="submitSignature()">確認簽署</button>
    </div>
  </div>
</div>

<!-- 生成PDF用：要真係喺畫面上render，html2canvas先影到，所以用遮罩蓋住 -->
<div id="busy" style="display:none; position:fixed; inset:0; background:#f4f4f5; z-index:9999;
  align-items:center; justify-content:center; font-size:15px; color:#555;">生成緊PDF，請稍等…</div>
<!-- 注意：呢個容器一定要係普通 flow（唔可以 position:absolute/fixed），否則 html2canvas 影出嚟會係白紙 -->
<div id="pdfStage" style="display:none; width:793px; margin:0; background:#fff;"></div>

<div class="cmodal" id="confirmModal">
  <div class="box">
    <h3>確定要簽署？</h3>
    <p>撳「確定簽署」之後，呢份協議會即時生效，<b>唔可以再更改或撤回</b>。<br>請先確認你已閱讀清楚全部內容，簽名亦已經簽妥。</p>
    <div class="btns">
      <button class="no" type="button" onclick="closeConfirm()">返去睇清楚</button>
      <button class="yes" type="button" onclick="reallySubmit()">確定簽署</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
<script src="form-doc.js"></script>
<script>
  const SUPABASE_URL = "https://berctchwlzjskjcjzani.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable__Nvdq0ZufT37BRdJ1F_TyA_IqkYnqj1";
  const BUCKET = "hkrea-v1";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const st = document.createElement('style'); st.textContent = HKREA.css; document.head.appendChild(st);

  const qs = new URLSearchParams(window.location.search);
  const token = qs.get('token');
  let sigLen = 0;
  const viewMode = qs.get('view') === '1';
  let record = null, ctx, drawing = false, last = null, localPdfUrl = null;

  function show(id){
    ['loadingState','errorState','signedState','docView'].forEach(x =>
      document.getElementById(x).style.display = (x === id) ? 'block' : 'none');
  }

  // 簽署成功之後，喺確認語句下面直接顯示已簽文件（唔使再彈message），畀客人即刻可以長按/下載
  function showInlinePreview(docData){
    document.getElementById('docView').style.display = 'block';
    document.querySelector('.panel').style.display = 'none';
    document.getElementById('viewBar').style.display = 'flex';
    document.getElementById('pvScale').innerHTML = HKREA.render(docData);
    fitPreview();
    Array.from(document.querySelectorAll('#pvScale img')).forEach(im => {
      if (!im.complete) im.addEventListener('load', fitPreview);
    });
    setTimeout(fitPreview, 400);
  }

  function toDoc(data, extra){
    const fd = data.form_data || {};
    return Object.assign({
      serial_no: data.serial_no,
      seller_name: data.seller_name,
      agency_type: data.agency_type,
      property_address: data.property_address,
      effective_from: data.effective_from,
      effective_to: data.effective_to,
      asking_price: data.asking_price
    }, fd, extra || {});
  }

  let zoomMode = 'fit';
  function toggleZoom(){ zoomMode = (zoomMode === 'fit') ? 'full' : 'fit'; fitPreview(); }
  function fitPreview(){
    const port = document.getElementById('pvPort');
    const scale = document.getElementById('pvScale');
    const holder = document.getElementById('pvHolder');
    if (!port.clientWidth) return;
    const fitS = Math.min(1, port.clientWidth / 794);
    const s = (zoomMode === 'full') ? 1 : fitS;
    port.style.overflowX = (s < 1) ? 'hidden' : 'auto';
    document.getElementById('pvZoom').textContent =
      (s < 1) ? ('放大睇 · ' + Math.round(s * 100) + '%')
              : (zoomMode === 'full' && fitS < 1 ? '縮細啱闊度' : '100%');
    scale.style.transform = `scale(${s})`;
    holder.style.height = (scale.offsetHeight * s) + 'px';
    holder.style.width = (794 * s) + 'px';
  }
  window.addEventListener('resize', fitPreview);

  async function urlOk(url){
    if (!url) return false;
    try{
      const r = await fetch(url, { method:'GET', headers:{ Range:'bytes=0-0' }, cache:'no-store' });
      return r.ok || r.status === 206;
    }catch(e){ return false; }
  }

  async function init(){
    if (!token){ show('errorState'); return; }
    const { data, error } = await sb.from('listings').select('*').eq('sign_token', token).single();
    if (error || !data){ show('errorState'); return; }
    record = data;

    if (viewMode){
      document.getElementById('pvScale').innerHTML = HKREA.render(toDoc(data));
      document.querySelector('.panel').style.display = 'none';
      document.getElementById('viewBar').style.display = 'flex';
      show('docView'); fitPreview();
      Array.from(document.querySelectorAll('#pvScale img')).forEach(im => {
        if (!im.complete) im.addEventListener('load', fitPreview);
      });
      setTimeout(fitPreview, 400);
      return;
    }

    if (data.status === 'signed'){
      document.getElementById('signedSerial').textContent = HKREA.formatSerial(data.serial_no);
      document.getElementById('signedAt').textContent = data.signed_at ? new Date(data.signed_at).toLocaleString('zh-HK') : '—';
      show('signedState');
      showInlinePreview(toDoc(data));
      const ok = await urlOk(data.signed_pdf_url);
      const link = document.getElementById('downloadLink');
      if (ok){ link.href = data.signed_pdf_url; }
      else {
        link.style.display = 'none';
        document.getElementById('regenBtn').style.display = 'inline-block';
        const w = document.getElementById('dlWarn');
        w.textContent = '份PDF喺storage度搵唔到（Object not found），撳下面「重新生成PDF」可以即時重新製作同上載。';
        w.style.display = 'block';
      }
      return;
    }

    document.getElementById('pvScale').innerHTML = HKREA.render(toDoc(data));
    show('docView');
    fitPreview();
    Array.from(document.querySelectorAll('#pvScale img')).forEach(im => {
      if (!im.complete) im.addEventListener('load', fitPreview);
    });
    setTimeout(fitPreview, 400);
    setupSig();
  }

  /* ---------- 簽名板 ---------- */
  function setupSig(){
    const canvas = document.getElementById('sigCanvas');
    ctx = canvas.getContext('2d');
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * devicePixelRatio;
    canvas.height = rect.height * devicePixelRatio;
    ctx.scale(devicePixelRatio, devicePixelRatio);
    ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.strokeStyle = '#1a3a8c';

    function pos(e){
      const r = canvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return { x: t.clientX - r.left, y: t.clientY - r.top };
    }
    function start(e){ drawing = true; last = pos(e); e.preventDefault(); }
    function move(e){
      if (!drawing) return;
      const p = pos(e);
      ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
      sigLen += Math.hypot(p.x - last.x, p.y - last.y);
      last = p; e.preventDefault();
    }
    function end(){ drawing = false; }
    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    canvas.addEventListener('mouseup', end);
    canvas.addEventListener('mouseleave', end);
    canvas.addEventListener('touchstart', start, {passive:false});
    canvas.addEventListener('touchmove', move, {passive:false});
    canvas.addEventListener('touchend', end);
  }
  function clearSig(){
    const c = document.getElementById('sigCanvas');
    ctx.clearRect(0, 0, c.width, c.height);
    sigLen = 0;
  }
  // 唔可以「篤一下」就當簽咗名：要有一定長度嘅筆跡
  function sigStrength(){ return sigLen; }
  function isSigEmpty(){
    const c = document.getElementById('sigCanvas');
    const blank = document.createElement('canvas');
    blank.width = c.width; blank.height = c.height;
    return c.toDataURL() === blank.toDataURL();
  }

  /* ---------- 生成 PDF ---------- */
  async function makePdfBlob(docData){
    const stage = document.getElementById('pdfStage');
    const busy = document.getElementById('busy');
    busy.style.display = 'flex';
    stage.innerHTML = HKREA.render(docData);
    stage.style.display = 'block';
    // 每頁固定 1122px = A4，交返 html2pdf 用高度切頁；唔好再加 page-break，否則會多咗空白頁
    stage.querySelectorAll('.paper').forEach(p => { p.style.boxShadow = 'none'; p.style.marginTop = '0'; });
    window.scrollTo(0, 0);
    // 等字體、圖同 layout 完全 ready，否則會出白紙
    if (document.fonts && document.fonts.ready) { try{ await document.fonts.ready; }catch(e){} }
    await Promise.all(Array.from(stage.querySelectorAll('img')).map(im =>
      im.complete ? Promise.resolve() : new Promise(r => { im.onload = im.onerror = r; })));
    await new Promise(r => setTimeout(r, 250));
    try{
    // iOS/Android嘅瀏覽器對單一canvas有面積上限（大概4096×4096），
    // scale:3 兩頁A4加埋好接近條線，手機度好容易整污糟/斷晒版；手機自動降返scale嚟保平安。
    const isMobileUA = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    const pdfScale = isMobileUA ? 2 : 3;
    const blob = await html2pdf().from(stage).set({
      margin: 0,
      filename: `${docData.serial_no}.pdf`,
      image: { type: 'jpeg', quality: 1 },
      html2canvas: { scale: pdfScale, useCORS: true, backgroundColor: '#ffffff', logging: false, letterRendering: true, imageTimeout: 15000 },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait', compress: false },
      pagebreak: { mode: ['legacy'] }
    }).outputPdf('blob');
    return blob;
    } finally {
      stage.innerHTML = ''; stage.style.display = 'none'; busy.style.display = 'none';
    }
  }

  function offerLocalDownload(blob, serial){
    if (localPdfUrl) URL.revokeObjectURL(localPdfUrl);
    localPdfUrl = URL.createObjectURL(blob);
    const link = document.getElementById('downloadLink');
    link.style.display = 'inline-block';
    link.href = localPdfUrl;
    link.setAttribute('download', serial + '.pdf');
    link.removeAttribute('target');
  }

  async function uploadPdf(blob, serial){
    const path = `pdfs/${serial}.pdf`;
    const up = await sb.storage.from(BUCKET).upload(path, blob, { upsert: true, contentType: 'application/pdf' });
    if (up.error) throw new Error('上載PDF失敗：' + up.error.message);
    const { data } = sb.storage.from(BUCKET).getPublicUrl(path);
    const ok = await urlOk(data.publicUrl);
    if (!ok) throw new Error('PDF上載咗但讀唔到（bucket可能唔係public）。');
    return data.publicUrl;
  }

  /* ---------- 提交簽署 ---------- */
  function submitSignature(){
    const errBox = document.getElementById('errMsg');
    errBox.style.display = 'none'; errBox.className = 'msg err';

    if (!document.getElementById('confirmRead').checked){
      errBox.textContent = '請先剔選確認已閱讀並明白協議內容。';
      errBox.style.display = 'block'; return;
    }
    if (isSigEmpty() || sigStrength() < 120){
      errBox.textContent = isSigEmpty()
        ? '請先喺方格內簽名。'
        : '簽名太短，唔似一個正式簽署。請撳「清除簽名」再簽多次。';
      errBox.style.display = 'block'; return;
    }
    // 撳「確認簽署」即刻真正簽署，唔再彈第二個確認彈窗
    reallySubmit();
  }
  function closeConfirm(){ document.getElementById('confirmModal').classList.remove('on'); }

  async function reallySubmit(){
    document.getElementById('confirmModal').classList.remove('on');
    const errBox = document.getElementById('errMsg');
    const btn = document.getElementById('submitBtn');
    errBox.style.display = 'none'; errBox.className = 'msg err';

    btn.disabled = true; btn.textContent = '處理緊，請稍等…';
    const sigCanvas = document.getElementById('sigCanvas');
    const sigData = sigCanvas.toDataURL('image/png');
    const today = new Date().toISOString().slice(0,10);
    const docData = toDoc(record, { signature_img: sigData, seller_date: today });

    let pdfBlob = null, pdfUrl = null, sigUrl = null, storageErr = null;

    try{
      pdfBlob = await makePdfBlob(docData);
    }catch(e){
      errBox.textContent = '生成PDF失敗：' + e.message;
      errBox.style.display = 'block';
      btn.disabled = false; btn.textContent = '確認簽署';
      return;
    }

    // storage 失敗都唔可以阻住簽署流程，先試上載
    try{
      const sigBlob = await new Promise(res => sigCanvas.toBlob(res, 'image/png'));
      const sp = `signatures/${token}.png`;
      const upSig = await sb.storage.from(BUCKET).upload(sp, sigBlob, { upsert: true, contentType: 'image/png' });
      if (upSig.error) throw new Error(upSig.error.message);
      sigUrl = sb.storage.from(BUCKET).getPublicUrl(sp).data.publicUrl;
      pdfUrl = await uploadPdf(pdfBlob, record.serial_no);
    }catch(e){ storageErr = e.message; }

    const newFd = Object.assign({}, record.form_data || {}, { signature_img: sigData, seller_date: today });
    const baseUpdate = {
      status: 'signed',
      signed_at: new Date().toISOString(),
      seller_signature_url: sigUrl,
      signed_pdf_url: pdfUrl,
      form_data: newFd
    };
    // listings 表未有 updated_at 欄嘅話（未行 SQL）就自動退返冇嗰個寫法，唔會累到簽署失敗
    let upd = await sb.from('listings').update(Object.assign({ updated_at: new Date().toISOString() }, baseUpdate)).eq('sign_token', token);
    if (upd.error && /updated_at/i.test(upd.error.message || '')){
      upd = await sb.from('listings').update(baseUpdate).eq('sign_token', token);
    }

    if (upd.error){
      errBox.textContent = '更新記錄失敗：' + upd.error.message;
      errBox.style.display = 'block';
      btn.disabled = false; btn.textContent = '確認簽署';
      return;
    }

    document.getElementById('signedSerial').textContent = HKREA.formatSerial(record.serial_no);
    document.getElementById('signedAt').textContent = new Date().toLocaleString('zh-HK');
    show('signedState');
    showInlinePreview(docData);

    if (pdfUrl){
      const link = document.getElementById('downloadLink');
      link.href = pdfUrl; link.style.display = 'inline-block';
    } else {
      offerLocalDownload(pdfBlob, record.serial_no);
      const w = document.getElementById('dlWarn');
      w.textContent = '簽署已完成，但PDF上載唔到storage（' + storageErr + '）。而家可以直接下載，遲啲喺後台重新生成。';
      w.style.display = 'block';
    }

    // 通知返兩位admin賣方已簽署（用Edge Function寄email，寄唔到都唔會影響前面個簽署流程）
    notifyAdminsSigned({ pdf_url: pdfUrl });
    // 自動備份已簽署PDF去Google Drive（同樣係fire-and-forget，失敗都唔會影響簽署流程）
    if (pdfUrl) backupToDrive(pdfUrl, `${record.serial_no}.pdf`);
  }

  function backupToDrive(pdfUrl, filename){
    try{
      fetch(`${SUPABASE_URL}/functions/v1/backup-drive`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
        body: JSON.stringify({ pdf_url: pdfUrl, filename })
      }).catch(() => {});
    }catch(e){ /* 靜靜地忽略，唔阻住簽署流程 */ }
  }

  function notifyAdminsSigned(extra){
    try{
      const viewUrl = `${location.origin}${location.pathname.replace(/[^\/]*$/, '')}sign.html?token=${encodeURIComponent(token)}&view=1`;
      fetch(`${SUPABASE_URL}/functions/v1/notify-signed`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
        body: JSON.stringify({
          serial_no: record.serial_no,
          property_address: record.property_address,
          seller_name: record.seller_name,
          view_url: viewUrl,
          ...extra
        })
      }).catch(() => {});
    }catch(e){ /* 靜靜地忽略，唔阻住簽署流程 */ }
  }

  async function downloadPdf(){
    if (record.signed_pdf_url && await urlOk(record.signed_pdf_url)){
      window.open(record.signed_pdf_url, '_blank'); return;
    }
    const blob = await makePdfBlob(toDoc(record));
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = record.serial_no + '.pdf'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    try{ const up = await uploadPdf(blob, record.serial_no);
         await sb.from('listings').update({ signed_pdf_url: up }).eq('sign_token', token); }catch(e){}
  }

  /* ---------- 已簽署但PDF 404：重新生成 ---------- */
  async function regeneratePdf(){
    const btn = document.getElementById('regenBtn');
    const w = document.getElementById('dlWarn');
    btn.disabled = true; btn.textContent = '重新生成中…';
    try{
      let sigData = null;
      if (record.seller_signature_url){
        try{
          const r = await fetch(record.seller_signature_url, { cache:'no-store' });
          if (r.ok){
            const b = await r.blob();
            sigData = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(b); });
          }
        }catch(e){}
      }
      const docData = toDoc(record, {
        signature_img: sigData,
        seller_date: record.signed_at ? record.signed_at.slice(0,10) : null
      });
      const blob = await makePdfBlob(docData);
      try{
        const url = await uploadPdf(blob, record.serial_no);
        await sb.from('listings').update({ signed_pdf_url: url }).eq('sign_token', token);
        const link = document.getElementById('downloadLink');
        link.href = url; link.style.display = 'inline-block'; link.setAttribute('target','_blank');
        w.textContent = 'PDF已重新生成並上載。';
        backupToDrive(url, `${record.serial_no}.pdf`);
      }catch(e){
        offerLocalDownload(blob, record.serial_no);
        w.textContent = 'Storage 仍然上載唔到（' + e.message + '），已經準備好本機下載。';
      }
      btn.style.display = 'none';
    }catch(e){
      w.textContent = '重新生成失敗：' + e.message;
      btn.disabled = false; btn.textContent = '重新生成PDF';
    }
  }

  init();
</script>
</body>
