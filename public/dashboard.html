<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>放盤紀錄 - 香港物業</title>
<style>
  :root{ --accent:#8b1a1a; --line:#e5e5e5; }
  *{box-sizing:border-box;}
  body{
    font-family:"PingFang HK","Noto Sans HK","Microsoft JhengHei",sans-serif; background:#f4f4f5;
    margin:0; padding:20px 14px 60px; color:#1a1a1a;
  }
  .wrap{max-width:1200px; margin:0 auto;}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:10px;}
  h1{font-size:18px; margin:0;}
  .who{font-size:13px; color:#888;}
  .btn{
    background:var(--accent); color:#fff; border:none; padding:10px 16px; border-radius:8px;
    font:inherit; font-size:14px; cursor:pointer; text-decoration:none; display:inline-block;
  }
  .btn.secondary{background:#e9e9ea; color:#333;}
  table{width:100%; border-collapse:collapse; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 2px 12px rgba(0,0,0,.05);}
  th, td{padding:12px 14px; text-align:left; font-size:13.5px; border-bottom:1px solid #f0f0f0;}
  th{background:#fafafa; color:#666; font-weight:600;}
  .status{display:inline-block; padding:3px 10px; border-radius:20px; font-size:12px; white-space:nowrap;}
  .status.draft{background:#f1f1f1; color:#666;}
  .status.sent{background:#fff3cd; color:#8a6d00;}
  .status.signed{background:#d1f5e0; color:#0a7a3d;}
  .row-actions{white-space:nowrap;}
  .row-actions a{margin-right:10px; font-size:13px; color:var(--accent); text-decoration:none;}
  .row-actions a.mute{color:#777;}
  .empty{padding:40px; text-align:center; color:#999;}
  @media (max-width:760px){
    table, thead, tbody, tr, td, th{display:block;}
    thead{display:none;}
    tr{background:#fff; border-radius:12px; margin-bottom:12px; padding:6px 4px; box-shadow:0 2px 12px rgba(0,0,0,.05);}
    td{border:none; padding:7px 14px;}
    td::before{content:attr(data-l); display:block; font-size:11.5px; color:#999; margin-bottom:2px;}
    .row-actions{padding-top:4px; border-top:1px solid #f0f0f0; margin-top:4px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1>放盤紀錄</h1>
      <span class="who" id="who"></span>
    </div>
    <div>
      <a class="btn" href="new-listing.html">＋ 新增放盤</a>
      <a class="btn secondary" href="new-listing.html#staff">員工資料</a>
      <a class="btn secondary" href="#" onclick="logout();return false;">登出</a>
    </div>
  </div>

  <table id="listTable" style="display:none;">
    <thead>
      <tr><th>流水號</th><th>物業地址</th><th>賣方</th><th>狀態</th><th>建立日期</th><th></th></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="emptyMsg" style="display:none;">未有放盤紀錄，撳右上角「＋ 新增放盤」開始。</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = "https://berctchwlzjskjcjzani.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable__Nvdq0ZufT37BRdJ1F_TyA_IqkYnqj1";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const statusLabel = { draft: '草稿', sent: '已送出待簽', signed: '已簽署' };

  async function init(){
    const { data: { session } } = await sb.auth.getSession();
    if (!session){ window.location.href = "index.html"; return; }
    document.getElementById('who').textContent = session.user.email;

    const { data, error } = await sb
      .from('listings')
      .select('serial_no, property_address, seller_name, status, created_at, sign_token, signed_pdf_url')
      .order('created_at', { ascending: false });

    if (error){ alert('讀取紀錄失敗：' + error.message); return; }
    if (!data || data.length === 0){ document.getElementById('emptyMsg').style.display = 'block'; return; }

    document.getElementById('listTable').style.display = 'table';
    document.getElementById('tbody').innerHTML = data.map(row => {
      const t = encodeURIComponent(row.sign_token);
      const signed = row.status === 'signed';
      return `
        <tr>
          <td data-l="流水號">${row.serial_no}</td>
          <td data-l="物業地址">${row.property_address || '—'}</td>
          <td data-l="賣方">${row.seller_name || '—'}</td>
          <td data-l="狀態"><span class="status ${row.status}">${statusLabel[row.status] || row.status}</span></td>
          <td data-l="建立日期">${new Date(row.created_at).toLocaleDateString('zh-HK')}</td>
          <td class="row-actions">
            <a href="sign.html?token=${t}&view=1">檢視</a>
            <a href="new-listing.html?serial=${encodeURIComponent(row.serial_no)}">編輯</a>
            ${signed
              ? `<a class="mute" href="${row.signed_pdf_url || ('sign.html?token=' + t + '&view=1')}" target="_blank" rel="noopener">PDF</a>`
              : `<a href="sign.html?token=${t}">簽署</a>`}
          </td>
        </tr>`;
    }).join('');
  }

  async function logout(){
    await sb.auth.signOut();
    window.location.href = "index.html";
  }

  init();
</script>
</body>
</html>
