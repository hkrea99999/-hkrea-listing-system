<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>放盤紀錄 - 香港物業</title>
<style>
  body{
    font-family:"PingFang HK","Noto Sans HK",sans-serif; background:#f4f4f5;
    margin:0; padding:20px;
  }
  .topbar{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;
    flex-wrap:wrap; gap:10px;
  }
  h1{font-size:18px; margin:0;}
  .who{font-size:13px; color:#888;}
  .btn{
    background:#8b1a1a; color:#fff; border:none; padding:10px 18px; border-radius:8px;
    font-size:14px; cursor:pointer; text-decoration:none; display:inline-block;
  }
  .btn.secondary{background:#e5e5e5; color:#333;}
  table{
    width:100%; border-collapse:collapse; background:#fff; border-radius:12px;
    overflow:hidden; box-shadow:0 2px 12px rgba(0,0,0,.05);
  }
  th, td{padding:12px 14px; text-align:left; font-size:13.5px; border-bottom:1px solid #eee;}
  th{background:#fafafa; color:#666; font-weight:600;}
  .status{
    display:inline-block; padding:3px 10px; border-radius:20px; font-size:12px;
  }
  .status.draft{background:#f1f1f1; color:#666;}
  .status.sent{background:#fff3cd; color:#8a6d00;}
  .status.signed{background:#d1f5e0; color:#0a7a3d;}
  .row-actions a{margin-right:10px; font-size:13px; color:#8b1a1a; text-decoration:none;}
  .empty{padding:40px; text-align:center; color:#999;}
</style>
</head>
<body>
  <div class="topbar">
    <div>
      <h1>放盤紀錄</h1>
      <span class="who" id="who"></span>
    </div>
    <div>
      <a class="btn" href="new-listing.html">＋ 新增放盤</a>
      <a class="btn secondary" href="#" onclick="logout()">登出</a>
    </div>
  </div>

  <table id="listTable" style="display:none;">
    <thead>
      <tr>
        <th>流水號</th><th>物業地址</th><th>賣方</th><th>狀態</th><th>建立日期</th><th></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="emptyMsg" style="display:none;">未有放盤紀錄，撳右上角「＋ 新增放盤」開始。</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    // TODO: 換做你自己個Supabase project嘅資料
    const SUPABASE_URL = "https://YOUR-PROJECT.supabase.co";
    const SUPABASE_ANON_KEY = "YOUR-ANON-PUBLIC-KEY";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const statusLabel = { draft: '草稿', sent: '已送出待簽', signed: '已簽署' };

    async function init(){
      const { data: { session } } = await sb.auth.getSession();
      if (!session){ window.location.href = "index.html"; return; }
      document.getElementById('who').textContent = session.user.email;

      const { data, error } = await sb
        .from('listings')
        .select('serial_no, property_address, seller_name, status, created_at')
        .order('created_at', { ascending: false });

      if (error){ alert('讀取紀錄失敗：' + error.message); return; }

      if (!data || data.length === 0){
        document.getElementById('emptyMsg').style.display = 'block';
        return;
      }
      document.getElementById('listTable').style.display = 'table';
      const tbody = document.getElementById('tbody');
      tbody.innerHTML = data.map(row => `
        <tr>
          <td>${row.serial_no}</td>
          <td>${row.property_address || '—'}</td>
          <td>${row.seller_name || '—'}</td>
          <td><span class="status ${row.status}">${statusLabel[row.status] || row.status}</span></td>
          <td>${new Date(row.created_at).toLocaleDateString('zh-HK')}</td>
          <td class="row-actions">
            <a href="sign.html?serial=${encodeURIComponent(row.serial_no)}">開啟</a>
          </td>
        </tr>
      `).join('');
    }

    async function logout(){
      await sb.auth.signOut();
      window.location.href = "index.html";
    }

    init();
  </script>
</body>
</html>
